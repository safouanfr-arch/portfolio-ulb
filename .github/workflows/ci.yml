name: Lab CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  labs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux lab dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential imagemagick python3-tk
      - name: Cache simulator tests
        working-directory: cache-simulator
        run: python3 -m unittest -v
      - name: Turtle maze logic tests
        working-directory: turtle-maze
        run: python3 -m unittest -v
      - name: Compile and test the chatroom
        working-directory: chatroom
        run: |
          make
          python3 -m unittest -v test_chat
      - name: JPEG compressor integration tests
        working-directory: jpeg-compressor
        run: |
          bash -n compress_jpg.sh
          python3 test_compressor.py -v
      - name: Build POSIX exercises
        run: make -C exercises/posix
